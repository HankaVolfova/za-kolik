:root{
  --dark:#06403B; --em:#00968B; --emL:#77D0B6; --pur:#D7ABFD; --yel:#EDD976; --bg:#FBF9F7;
  --ink:#16302D; --ink2:#46605C; --muted:#6B7F7C; --line:#E4E0DA; --card:#FFFFFF;
  --emT:#E3F5EF; --purT:#F4E9FF; --yelT:#FBF5D6; --loss:#06403B; --gain:#00796F; --warn:#8A6A00;
  --c1:#00968B; --c2:#D7ABFD;
  --r:16px; --rs:10px;
  --ff:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fh:'Fraunces', Georgia, serif;
  --shadow:0 1px 2px rgba(6,64,59,.05), 0 6px 24px rgba(6,64,59,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);color:var(--dark);font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:1.9rem;line-height:1.15}
h3{font-size:1.2rem}
p{margin:.4em 0}
a{color:var(--em)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(251,249,247,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:30}
.brand{font-family:var(--fh);font-size:1.45rem;font-weight:700;color:var(--dark);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px 9px 9px 2px;background:var(--yel);font-size:.95rem;transform:rotate(-8deg)}
.proj{flex:1;min-width:0;color:var(--ink2);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj b{color:var(--dark)}
.savestate{font-size:.8rem;color:var(--muted);white-space:nowrap}
.menu{position:relative}
.menu>summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;color:var(--dark);font-size:.9rem;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:270px;z-index:40}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:9px;color:var(--ink)}
.menu .pop button:hover{background:var(--emT)}
.menu .pop .danger{color:var(--loss)}
.menu .pop .note{font-size:.78rem;color:var(--muted);padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:6px}

.demo-banner{background:repeating-linear-gradient(135deg,var(--yelT) 0 14px,#F7EDB8 14px 28px);border-bottom:1px solid #E9DB98;padding:9px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.demo-banner b{color:var(--dark)}
.demo-banner .sp{flex:1}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:6px;padding:14px 24px 0;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{flex:1 0 auto;min-width:132px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;text-align:left;color:var(--ink);transition:border-color .15s, box-shadow .15s}
.st:hover{border-color:var(--emL)}
.st.on{border-color:var(--em);box-shadow:0 0 0 3px var(--emT)}
.st .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:.85rem;color:var(--ink2);flex:none}
.st.done .n{background:var(--em);border-color:var(--em);color:#fff}
.st.progress .n{border-color:var(--em);color:var(--dark);background:var(--emT)}
.st .t{display:flex;flex-direction:column;line-height:1.2}
.st .t b{font-size:.9rem;font-weight:600;white-space:nowrap}
.st .t small{font-size:.74rem;color:var(--muted)}
.st.done .t small{color:var(--gain);font-weight:600}
.st.progress .t small{color:var(--dark)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:22px 24px 80px;max-width:1360px;margin:0 auto}
main{min-width:0}
aside{position:sticky;top:76px;align-self:start}
@media (max-width:1099px){ .layout{grid-template-columns:1fr} aside{display:none} }
@media (min-width:1100px){ .msum{display:none} }

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card+.card,.block+.block{margin-top:18px}
.grid2>.card{margin-top:0!important}
.stephead{margin-bottom:18px}
.stephead .kicker{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--em)}
.stephead p{color:var(--ink2);max-width:62ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){ .grid2{grid-template-columns:1fr} h2{font-size:1.55rem} .layout{padding:16px 14px 80px} .top{padding:10px 14px} .stepper{padding:10px 14px 0} .card{padding:16px} }

/* ---------- forms ---------- */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f>label,.lbl{font-weight:600;font-size:.9rem;color:var(--dark)}
.f .opt{font-weight:400;color:var(--muted);font-size:.8rem}
.hint{font-size:.83rem;color:var(--ink2)}
input[type=text],input[type=date],input[type=url],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:var(--rs);padding:9px 11px;width:100%;transition:border-color .15s, box-shadow .15s}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--emT)}
input.bad,textarea.bad{border-color:var(--pur);border-width:2px;background:#FBF5FF}
.errmsg{font-size:.8rem;color:var(--loss);font-weight:600}
.withsuf{display:flex;align-items:center;gap:8px}
.withsuf input{flex:1}
.withsuf .suf{color:var(--ink2);font-size:.9rem;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums}

.btn{border:1.5px solid var(--dark);background:var(--dark);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .1s, background .15s}
.btn:hover{background:#0A5A53}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--dark);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--em);background:var(--emT)}
.btn.soft{background:var(--emT);color:var(--dark);border-color:transparent}
.btn.soft:hover{background:#D3EFE6}
.btn.yel{background:var(--yel);border-color:var(--yel);color:var(--dark)}
.btn.yel:hover{background:#E5CF5C}
.btn.danger{background:var(--pur);border-color:var(--pur);color:var(--dark)}
.btn.danger:hover{background:#C994F7}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:1.1rem}
.iconbtn:hover{background:var(--purT);color:var(--loss)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{border:1px dashed var(--emL);background:#fff;border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--dark)}
.chip:hover{background:var(--emT);border-style:solid}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}

/* info boxes */
.info{border-radius:14px;padding:13px 16px;font-size:.9rem;background:var(--emT);color:var(--ink);border-left:4px solid var(--em)}
.info.pur{background:var(--purT);border-left-color:var(--pur)}
.info.yel{background:var(--yelT);border-left-color:var(--yel)}
.info.warn{background:#FFF6DB;border-left-color:#E0B400}
.info.bad{background:#F7ECFD;border-left-color:var(--pur)}
.info b{color:var(--dark)}
.info+.info{margin-top:10px}
.hanka{background:var(--yel);border-radius:4px 18px 18px 18px;padding:16px 18px;transform:rotate(-.6deg);box-shadow:0 8px 18px rgba(130,110,0,.15);max-width:520px;margin-top:20px}
.hanka .who{font-family:var(--fh);font-weight:700;color:var(--dark);font-size:.95rem}
details.how{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
details.how>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--dark);font-size:.9rem}
details.how>div{padding:0 14px 14px;font-size:.9rem}
.formula{font-variant-numeric:tabular-nums;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.84rem;overflow-x:auto}

/* rows (costs, respondents) */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;gap:8px;align-items:start;background:var(--bg);border-radius:12px;padding:10px}
.row.fixed{grid-template-columns:minmax(0,1fr) 118px 34px}
.row.fixed .nm{grid-column:1/3}
.row.var{grid-template-columns:minmax(0,1fr) 34px}
.row .note{grid-column:1/-2}
.row .amt{grid-column:1/2}
.row .sub{font-size:.76rem;color:var(--muted);margin-top:3px}
.row.resp{grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) 34px;align-items:center}
.row.resp.err{background:#F7ECFD;outline:1.5px solid var(--pur)}
.rowhead{display:grid;gap:8px;padding:0 10px;font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rowhead.resp{grid-template-columns:110px minmax(0,1fr) minmax(0,1fr) 34px}
.rowmsg{grid-column:1/-1;font-size:.8rem;color:var(--loss);font-weight:600}
@media (max-width:640px){
  .row.resp{grid-template-columns:1fr 1fr 34px;grid-template-areas:"lab lab x" "id mx mx" "msg msg msg";align-items:end}
  .row.resp .lab{grid-area:lab}.row.resp .tg{grid-area:tg}.row.resp .iconbtn{grid-area:x}.row.resp .cid{grid-area:id}.row.resp .cmx{grid-area:mx}.row.resp .rowmsg{grid-area:msg}
  .brand{font-size:1.2rem}.savestate{display:none}
  .rowhead.resp{display:none}
  .row.resp input::placeholder{color:var(--ink2)}
}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:.78rem;color:var(--ink2);line-height:1.3}
.tile .v{font-family:var(--fh);font-size:1.45rem;font-weight:600;color:var(--dark);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.tile .v small{font-family:var(--ff);font-size:.78rem;color:var(--muted);font-weight:500}
.tile.hl{background:var(--emT);border-color:transparent}
.tile .miss{font-size:.78rem;color:var(--muted);margin-top:2px}

/* summary panel */
.sum{background:var(--dark);color:#EAF7F3;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.sum h3{color:#fff;font-size:1.05rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.sum h3 small{font-family:var(--ff);font-size:.72rem;color:var(--emL);font-weight:500}
.sum .it{padding:11px 0;border-top:1px solid rgba(255,255,255,.12)}
.sum .it .k{font-size:.78rem;color:#B9DDD5}
.sum .it .v{font-family:var(--fh);font-size:1.4rem;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;line-height:1.25}
.sum .it .v small{font-family:var(--ff);font-size:.75rem;color:#B9DDD5;font-weight:500}

// ===== Za kolik? — výpočetní jádro =====
// Čísla: vstupy jsou textové řetězce (česká desetinná čárka), výsledky nikdy NaN/Infinity.

function parseNum(raw) {
  // Vrací {state:'empty'|'ok'|'invalid', value:number|null}
  if (raw === null || raw === undefined) return { state: 'empty', value: null };
  if (typeof raw === 'number') return isFinite(raw) ? { state: 'ok', value: raw } : { state: 'invalid', value: null };
  let s = String(raw).trim();
  if (s === '') return { state: 'empty', value: null };

  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '');
  s = s.replace(',', '.');
  if (!/^[-+−]?\d+(\.\d+)?$/.test(s) && !/^[-+−]?\.\d+$/.test(s)) return { state: 'invalid', value: null };
  const v = Number(s.replace('−', '-'));
  return isFinite(v) ? { state: 'ok', value: v } : { state: 'invalid', value: null };
}

function numOrNull(raw) { const p = parseNum(raw); return p.state === 'ok' ? p.value : null; }

// Zaokrouhlení nahoru na přesnost prodejní jednotky (např. 1, 0.5, 0.1)
function ceilToPrecision(x, prec) {

  const k = x / prec;
  // tolerance proti 1199.9999999 → 1200
  const r = Math.ceil(k - 1e-9);
  return Number((r * prec).toFixed(6));
}

// Agregace nákladů z položek
function sumFixed(items) {
  // vrací {value, filled, invalid, list}
  let total = 0, filled = 0, invalid = 0;
  for (const it of items || []) {
    const p = parseNum(it.amount);
    if (p.state === 'invalid' || (p.state === 'ok' && p.value < 0)) { invalid++; continue; }
    if (p.state === 'ok') { filled++; total += it.period === 'm' ? p.value * 12 : p.value; }
  }

}
function sumVariable(items) {
  let total = 0, filled = 0, invalid = 0;
  for (const it of items || []) {
    const p = parseNum(it.amount);
    if (p.state === 'invalid' || (p.state === 'ok' && p.value < 0)) { invalid++; continue; }
    if (p.state === 'ok') { filled++; total += p.value; }

// Hlavní model: F, v, Q, P jsou čísla nebo null

// ---- formátování ----
const nf = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 1 });
const nf4 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 4 });
const MINUS = '−';
function fmtN(n, f = nf) { if (n === null || n === undefined || !isFinite(n)) return '—'; const s = f.format(Math.abs(n)); return (n < 0 && Math.abs(n) > 1e-9 ? MINUS : '') + s; }
function fmtKc(n) { return n === null || n === undefined ? '—' : fmtN(n) + ' Kč'; }
function fmtSigned(n, suffix = ' Kč') { if (n === null || n === undefined) return '—'; return (n > 1e-9 ? '+' : '') + fmtN(n) + suffix; }
function fmtPct(n) { return n === null || !isFinite(n) ? '—' : nf1.format(n) + ' %'; }
function toInput(n) { if (n === null || n === undefined || !isFinite(n)) return ''; return String(Math.round(n * 10000) / 10000).replace('.', ','); }
function fmtAxis(n) {
  const a = Math.abs(n), s = n < 0 ? MINUS : '';
  if (a >= 1e6) return s + nf1.format(a / 1e6) + ' mil.';
  if (a >= 1e4) return s + nf0.format(a / 1e3) + ' tis.';
  return s + nf.format(a);
}

function unitInfo(meta) {
  const u = UNITS[meta.unit] || UNITS.jine;
  const custom = (meta.unitCustom || '').trim();
  const label = meta.unit === 'jine' ? (custom || 'jednotka') : u.label;
  const short = meta.unit === 'jine' ? (custom || 'j.') : u.short;
  const prec = u.fixedPrec || Number(meta.prec) || 1;
  return { label, short, prec, integer: prec === 1 };
}

// ---- odvozené hodnoty ----
function derive(p) {
  const u = unitInfo(p.meta);
  const fx = sumFixed(p.fixed), vx = sumVariable(p.variable);
  const qP = parseNum(p.meta.qty);
  let Q = null, qErr = '';
  if (qP.state === 'invalid') qErr = 'Zadejte číslo, např. 2 000.';
  else if (qP.state === 'ok') {
    if (qP.value < 0) qErr = 'Prodej nemůže být záporný.';
    else if (u.integer && Math.abs(qP.value - Math.round(qP.value)) > 1e-9) qErr = 'U této jednotky zadejte celé číslo.';
    else Q = qP.value;
  }
  const pP = parseNum(p.pricing.price);
  let Pr = null, pErr = '';
  if (pP.state === 'invalid') pErr = 'Zadejte číslo, např. 249 nebo 249,90.';
  else if (pP.state === 'ok') { if (pP.value < 0) pErr = 'Cena nemůže být záporná.'; else Pr = pP.value; }
  const F = fx.invalid ? null : fx.value, v = vx.invalid ? null : vx.value;
  const m = model(F, v, Q, Pr, u.prec);
  const stats = respondentStats(p.resp, false);
  const comps = p.comps.map(c => ({ c, u: competitorUnit(c) }));
  const hints = {
    P: pErr ? 'Opravte cenu v kroku 5.' : 'Doplňte cenu v kroku 5.',
    Q: qErr ? 'Opravte plánovaný prodej v kroku 1.' : 'Doplňte plánovaný prodej v kroku 1.',
    F: fx.invalid ? 'Opravte neplatné fixní náklady v kroku 2.' : 'Doplňte fixní náklady v kroku 2.',
    v: vx.invalid ? 'Opravte neplatné variabilní náklady v kroku 2.' : 'Doplňte variabilní náklady v kroku 2.',
  };
  const miss = (...keys) => keys.filter(k => ({ P: Pr, Q, F, v }[k]) === null).map(k => hints[k]);
  return { u, fx, vx, Q, qErr, P: Pr, pErr, F, v, m, stats, comps, miss };
}

function filled(s) { return String(s ?? '').trim() !== ''; }
function stepStatus(p, d, i) {
  switch (i) {
    case 1: {
      const keys = ['team', 'product', 'qty'];
      const n = keys.filter(k => filled(p.meta[k])).length;
      const ok = n === keys.length && d.Q !== null && d.Q > 0 && (p.meta.unit !== 'jine' || filled(p.meta.unitCustom));
      return ok ? 'done' : (n ? 'progress' : 'empty');
    }
    case 2: {
      const t = [...p.fixed, ...p.variable].some(r => filled(r.name) || filled(r.amount));
      return d.fx.filled && d.vx.filled && !d.fx.invalid && !d.vx.invalid ? 'done' : (t ? 'progress' : 'empty');
    }
    case 3: {
      const t = p.resp.some(r => filled(r.ideal) || filled(r.max));
      return d.stats.complete >= 6 && !d.stats.errors.length ? 'done' : (t ? 'progress' : 'empty');
    }
    case 4: {
      const t = p.noComp || filled(p.position) || filled(p.positionWhy) || p.comps.some(c => filled(c.name) || filled(c.price) || filled(c.diff));
      const okComps = p.noComp ? filled(p.noCompReason) && filled(p.alternative) : d.comps.filter(x => x.u.state === 'ok' && filled(x.c.name)).length >= 2;
      return okComps && filled(p.position) && filled(p.positionWhy) ? 'done' : (t ? 'progress' : 'empty');
    }
    case 5: {
      const pr = p.pricing;
      const t = filled(pr.price) || filled(pr.strategy) || filled(pr.strategyWhy) || filled(pr.defCosts);
      return d.P !== null && filled(pr.strategy) && filled(pr.strategyWhy) && filled(pr.defCosts) && filled(pr.defCustomers) && filled(pr.defCompetition) ? 'done' : (t ? 'progress' : 'empty');
    }
    case 6: return p.plan ? (p.expTried ? 'done' : 'progress') : 'empty';
    case 7: return [1, 2, 3, 4, 5].every(i => stepStatus(p, d, i) === 'done') ? 'done' : (p.plan ? 'progress' : 'empty');
  }
}
const STATUS_TXT = { empty: 'Nevyplněno', progress: 'Rozpracováno', done: 'Hotovo' };

// ---- import / sanitace ----
function sanitizeProject(raw) {
  const warn = [];
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Soubor neobsahuje projekt aplikace Za kolik?');
  if (!raw.meta || typeof raw.meta !== 'object') throw new Error('V souboru chybí základní údaje o produktu (část „meta“).');
  const b = blankProject();
  const str = (x, max = 4000) => typeof x === 'string' ? x.slice(0, max) : (typeof x === 'number' && isFinite(x) ? String(x).replace('.', ',') : '');
  const arr = (x, name) => { if (x === undefined) return []; if (!Array.isArray(x)) { warn.push(`Část „${name}“ nemá správný formát, byla vynechána.`); return []; } if (x.length > 300) warn.push(`Část „${name}“ byla zkrácena na 300 řádků.`); return x.slice(0, 300).filter(o => o && typeof o === 'object'); };
  for (const k of Object.keys(b.meta)) b.meta[k] = str(raw.meta[k], k === 'desc' || k === 'qtyReason' ? 4000 : 300) || b.meta[k];
  if (!UNITS[b.meta.unit]) { b.meta.unitCustom = b.meta.unit; b.meta.unit = 'jine'; }
  if (!PRECS.some(([v]) => v === b.meta.prec)) b.meta.prec = '1';
  if (Array.isArray(raw.fixed)) b.fixed = arr(raw.fixed, 'fixní náklady').map(r => ({ id: uid(), name: str(r.name, 200), amount: str(r.amount, 40), period: r.period === 'y' ? 'y' : 'm', note: str(r.note, 500) }));
  if (Array.isArray(raw.variable)) b.variable = arr(raw.variable, 'variabilní náklady').map(r => ({ id: uid(), name: str(r.name, 200), amount: str(r.amount, 40), note: str(r.note, 500) }));
  if (Array.isArray(raw.resp)) b.resp = arr(raw.resp, 'respondenti').map((r, i) => ({ id: uid(), label: str(r.label, 40) || 'R' + (i + 1), ideal: str(r.ideal, 40), max: str(r.max, 40), target: ['ano', 'ne', 'nevime'].includes(r.target) ? r.target : '' }));
  if (Array.isArray(raw.comps)) b.comps = arr(raw.comps, 'konkurenti').map(r => ({ id: uid(), name: str(r.name, 200), price: str(r.price, 40), qty: str(r.qty, 40) || '1', source: str(r.source, 500), date: /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : '', diff: str(r.diff, 1000) }));
  // prázdné nákladové řádky (např. ze starší verze) nepřenášíme
  const blankRow = r => !filled(r.name) && !filled(r.amount);
  b.fixed = b.fixed.filter(r => !blankRow(r)); b.variable = b.variable.filter(r => !blankRow(r));
  b.respOnlyTarget = false;
  b.noComp = raw.noComp === true;
  for (const k of ['noCompReason', 'alternative', 'positionWhy']) b[k] = str(raw[k]);
  b.position = POSITIONS[raw.position] ? raw.position : '';
  if (raw.pricing && typeof raw.pricing === 'object') for (const k of Object.keys(b.pricing)) b.pricing[k] = str(raw.pricing[k]);
  if (!STRATS[b.pricing.strategy]) b.pricing.strategy = '';
  const pl = raw.plan;
  const items = (x, per) => Array.isArray(x) ? x.slice(0, 300).filter(r => r && typeof r === 'object').map(r => per ? { id: uid(), name: str(r.name, 200), amount: str(r.amount, 40), period: r.period === 'y' ? 'y' : 'm' } : { id: uid(), name: str(r.name, 200), amount: str(r.amount, 40) }) : null;
  if (pl && typeof pl === 'object' && ['P', 'Q', 'F', 'v'].every(k => typeof pl[k] === 'number' && isFinite(pl[k]) && pl[k] >= 0) && Array.isArray(pl.fixed) && Array.isArray(pl.variable)) b.plan = { P: pl.P, Q: pl.Q, F: pl.F, v: pl.v, fixed: items(pl.fixed, true), variable: items(pl.variable, false), savedAt: str(pl.savedAt, 40) };
  else if (pl) warn.push('Uložený plán pro porovnání nebyl platný, uložte ho prosím znovu v kroku 6.');
  const ex = raw.exp;
  if (b.plan && ex && typeof ex === 'object' && Array.isArray(ex.fixed) && Array.isArray(ex.variable)) b.exp = { mode: ex.mode === 'markup' ? 'markup' : 'manual', P: str(ex.P, 40), markup: str(ex.markup, 40), Q: str(ex.Q, 40), fixed: items(ex.fixed, true), variable: items(ex.variable, false) };
  else b.exp = null;
  b.expTried = raw.expTried === true;
  b.isDemo = raw.isDemo === true;
  if (!b.comps.length) b.comps = blankProject().comps;
  // kontrola číselných polí
  const bad = [];
  if (parseNum(b.meta.qty).state === 'invalid') bad.push('plánovaný prodej');
  if (b.fixed.some(r => parseNum(r.amount).state === 'invalid')) bad.push('fixní náklady');
  if (b.variable.some(r => parseNum(r.amount).state === 'invalid')) bad.push('variabilní náklady');
  if (b.resp.some(r => parseNum(r.ideal).state === 'invalid' || parseNum(r.max).state === 'invalid')) bad.push('odpovědi respondentů');
  if (b.comps.some(r => parseNum(r.price).state === 'invalid' || parseNum(r.qty).state === 'invalid')) bad.push('ceny konkurence');
  if (parseNum(b.pricing.price).state === 'invalid') bad.push('zvolená cena');
  if (bad.length) warn.push('Neplatná čísla v těchto částech (jsou označená k opravě): ' + bad.join(', ') + '.');
  return { project: b, warn };
}
function projectHasData(p) {
  if (!p) return false;
  const d = derive(p);
  return [1, 2, 3, 4, 5, 6].some(i => stepStatus(p, d, i) !== 'empty');
}

// ===== Grafy (SVG, bez knihoven) =====
const C1 = '#00968B', C2 = '#D7ABFD', CDARK = '#06403B', GRID = '#ECE8E2', AX = '#B9B3AA', LOSSF = '#F1E3FB', GAINF = '#DDF3EC';

function niceStep(range, target) {
  const raw = range / Math.max(1, target), mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function ticks(min, max, target = 5) {
  if (max === min) { max = min + 1; }
  const st = niceStep(max - min, target);
  const a = Math.floor(min / st) * st, b = Math.ceil(max / st) * st;
  const out = []; for (let x = a; x <= b + st * 1e-6; x += st) out.push(Number(x.toFixed(10)));
  return out;
}
// Sloupec se zaobleným koncem odvráceným od základny
function barPath(x, yBase, yEnd, w, r = 4) {
  const h = Math.abs(yEnd - yBase); r = Math.min(r, w / 2, h);
  if (h < .5) return `M${x},${yBase}h${w}`;
  if (yEnd < yBase) return `M${x},${yBase}V${yEnd + r}Q${x},${yEnd} ${x + r},${yEnd}H${x + w - r}Q${x + w},${yEnd} ${x + w},${yEnd + r}V${yBase}Z`;
  return `M${x},${yBase}V${yEnd - r}Q${x},${yEnd} ${x + r},${yEnd}H${x + w - r}Q${x + w},${yEnd} ${x + w},${yEnd - r}V${yBase}Z`;
}

// 1) Sloupcový graf: plán vs experiment
function chartBars(a, b) {
  const W = 560, H = 300, L = 66, R = 12, T = 22, B = 40;
  const cats = [['Tržby', 'revenue'], ['Celkové náklady', 'costTotal'], ['Zisk / ztráta', 'profit']];
  const vals = cats.flatMap(([, k]) => [a[k], b[k]]).filter(v => v !== null);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const tk = ticks(lo, hi, 5); lo = tk[0]; hi = tk[tk.length - 1];
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const gw = (W - L - R) / cats.length, bw = Math.min(46, gw * .3);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sloupcový graf: tržby, celkové náklady a zisk plánu a nové varianty v Kč za rok">`;
  for (const t of tk) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? AX : GRID}" stroke-width="${t === 0 ? 1.5 : 1}"/><text class="axt" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmtAxis(t)}</text>`;
  s += `<text class="axt" x="${L - 8}" y="10" text-anchor="end">Kč za rok</text>`;
  cats.forEach(([name, k], i) => {
    const cx = L + gw * i + gw / 2;
    [[a[k], C1, 'Náš plán', -1], [b[k], C2, 'Nová varianta', 1]].forEach(([v, col, ser, side]) => {
      if (v === null) return;
      const x = cx + (side < 0 ? -bw - 2 : 2);
      const tip = `${ser} · ${name}\n${fmtKc(v)}`;
      s += `<path d="${barPath(x, y(0), y(v), bw)}" fill="${col}" data-tip="${esc(tip)}"/>`;
      const ly = v >= 0 ? y(v) - 6 : y(v) + 14;
      s += `<text x="${x + bw / 2}" y="${ly}" text-anchor="middle" class="lbl" style="font-size:12px">${fmtAxis(v)}</text>`;
    });
    s += `<text x="${cx}" y="${H - B + 20}" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#16302D">${name}</text>`;
  });
  return s + '</svg>';
}

// 2) Graf tržeb a nákladů podle množství (bod zvratu)
function chartCVP(m, prec, unitShort, extra = {}) {
  const { F, v, P, Q } = m;
  if ([F, v, P, Q].some(x => x === null)) return '';
  const W = 560, H = 320, L = 66, R = 16, T = 22, B = 46;
  let qmax = Math.max(Q * 1.6, 10 * prec, 10);
  if (m.beRaw && isFinite(m.beRaw)) qmax = Math.max(qmax, m.beRaw * 1.5);
  if (extra.planQ) qmax = Math.max(qmax, extra.planQ * 1.2);
  const xt = ticks(0, qmax, 5); qmax = xt[xt.length - 1];
  const ymaxRaw = Math.max(P * qmax, F + v * qmax, 1);
  const yt = ticks(0, ymaxRaw, 5); const ymax = yt[yt.length - 1];
  const x = q => L + q / qmax * (W - L - R), y = val => T + (ymax - val) / ymax * (H - T - B);
  const rev = q => P * q, cost = q => F + v * q;
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spojnicový graf tržeb a celkových nákladů podle prodaného množství s bodem zvratu" data-cvp='${JSON.stringify({ F, v, P, qmax, ymax, L, R, T, B, W, H, u: unitShort })}'>`;
  for (const t of yt) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? AX : GRID}"/><text class="axt" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmtAxis(t)}</text>`;
  for (const t of xt) s += `<line x1="${x(t)}" x2="${x(t)}" y1="${H - B}" y2="${H - B + 4}" stroke="${AX}"/><text class="axt" x="${x(t)}" y="${H - B + 17}" text-anchor="middle">${fmtAxis(t)}</text>`;
  s += `<text class="axt" x="${L - 8}" y="10" text-anchor="end">Kč za rok</text>`;
  s += `<text class="axt" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">Prodané množství za rok (${esc(unitShort)})</text>`;
  // oblasti ztráty a zisku
  const poly = (q0, q1) => `${x(q0)},${y(rev(q0))} ${x(q1)},${y(rev(q1))} ${x(q1)},${y(cost(q1))} ${x(q0)},${y(cost(q0))}`;
  if (P > v && m.beRaw !== undefined && m.beRaw < qmax) {
    if (m.beRaw > 0) s += `<polygon points="${poly(0, m.beRaw)}" fill="${LOSSF}"/>`;
    s += `<polygon points="${poly(Math.max(0, m.beRaw), qmax)}" fill="${GAINF}"/>`;
  } else s += `<polygon points="${poly(0, qmax)}" fill="${LOSSF}"/>`;
  // fixní náklady (vodorovně)
  if (F > 0) {
    s += `<line x1="${x(0)}" y1="${y(F)}" x2="${x(qmax)}" y2="${y(F)}" stroke="#46605C" stroke-width="2" stroke-dasharray="2 4" data-tip="${esc('Fixní náklady: ' + fmtKc(F) + ' za rok\nPlatíte je při jakémkoli prodeji.')}"/>`;
    s += `<text x="${W - R - 4}" y="${y(F) + 15}" text-anchor="end" class="lbl" style="fill:#46605C">Fixní náklady ${fmtAxis(F)}</text>`;
  }
  // přímky
  s += `<line x1="${x(0)}" y1="${y(cost(0))}" x2="${x(qmax)}" y2="${y(cost(qmax))}" stroke="${C2}" stroke-width="3.5" stroke-dasharray="8 4"/>`;
  s += `<line x1="${x(0)}" y1="${y(rev(0))}" x2="${x(qmax)}" y2="${y(rev(qmax))}" stroke="${C1}" stroke-width="2.5"/>`;
  // přímé popisky na konci čar
  const ry = y(rev(qmax)), cy = y(cost(qmax));
  const sep = Math.abs(ry - cy) < 14 ? (ry < cy ? -7 : 7) : 0;
  s += `<text x="${W - R - 4}" y="${ry - 6 + sep}" text-anchor="end" class="lbl" style="fill:${C1}">Tržby</text>`;
  s += `<text x="${W - R - 4}" y="${cy + 14 - sep}" text-anchor="end" class="lbl" style="fill:#06403B">Celkové náklady (fixní + variabilní)</text>`;
  // plánovaný objem (pokud se liší)
  if (extra.planQ !== undefined && extra.planQ !== Q && extra.planQ <= qmax) {
    s += `<line x1="${x(extra.planQ)}" x2="${x(extra.planQ)}" y1="${T}" y2="${H - B}" stroke="${AX}" stroke-dasharray="2 4"/><text x="${x(extra.planQ) + 4}" y="${T + 22}" class="axt">plán</text>`;
  }
  // aktuální objem
  s += `<line x1="${x(Q)}" x2="${x(Q)}" y1="${T}" y2="${H - B}" stroke="${CDARK}" stroke-width="1.5"/>`;
  const qAnchor = x(Q) > W - 150 ? 'end' : 'start', qdx = qAnchor === 'end' ? -5 : 5;
  s += `<text x="${x(Q) + qdx}" y="${T + 8}" text-anchor="${qAnchor}" class="lbl" style="font-size:11px">${esc(extra.qLabel || 'Objem')}: ${fmtN(Q)} ${esc(unitShort)}</text>`;
  // bod zvratu
  if (m.beState === 'ok' && m.beRaw <= qmax) {
    const bx = x(m.beRaw), by = y(rev(m.beRaw));
    s += `<circle cx="${bx}" cy="${by}" r="6" fill="#EDD976" stroke="${CDARK}" stroke-width="2" data-tip="${esc('Bod zvratu: ' + fmtN(m.be) + ' ' + unitShort + '\nTržby = náklady ≈ ' + fmtKc(P * m.beRaw))}"/>`;
    const a = bx > W - 170 ? 'end' : 'start', dx = a === 'end' ? -10 : 10;
    s += `<text x="${bx + dx}" y="${by + 20}" text-anchor="${a}" class="lbl">Bod zvratu: ${fmtN(m.be)} ${esc(unitShort)}</text>`;
  }
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${CDARK}" stroke-opacity=".35" visibility="hidden"/>`;
  s += `<rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  return s + '</svg>';
}

// 3) Zákaznická sonda — činkový graf (ideální → maximální cena)
function chartResp(p, stats, refs = []) {
  const rows = [];
  p.resp.forEach((r, i) => {
    const a = parseNum(r.ideal), b = parseNum(r.max);
    if (a.state === 'ok' && b.state === 'ok' && a.value >= 0 && b.value >= a.value) {
      rows.push({ label: r.label || ('R' + (i + 1)), ideal: a.value, max: b.value, target: r.target, used: stats.used.some(u => u.i === i) });
    }
  });
  if (!rows.length) return '<p class="hint">Graf se zobrazí, jakmile vyplníte první úplnou odpověď.</p>';
  const W = 560, rowH = 26, T = 34, B = 34, L = 96, R = 18, H = T + B + rows.length * rowH;
  const allx = rows.flatMap(r => [r.ideal, r.max]).concat(refs.map(r => r.v).filter(v => v !== null));
  const xt = ticks(0, Math.max(...allx, 1) * 1.05, 5), xmax = xt[xt.length - 1];
  const x = v => L + v / xmax * (W - L - R);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf odpovědí respondentů: ideální a maximální cena v Kč">`;
  for (const t of xt) s += `<line x1="${x(t)}" x2="${x(t)}" y1="${T - 6}" y2="${H - B}" stroke="${GRID}"/><text class="axt" x="${x(t)}" y="${H - B + 16}" text-anchor="middle">${fmtAxis(t)}</text>`;
  s += `<text class="axt" x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">Cena za jednotku (Kč)</text>`;
  refs.forEach((r, k) => {
    if (r.v === null) return;
    s += `<line x1="${x(r.v)}" x2="${x(r.v)}" y1="${T - 10}" y2="${H - B}" stroke="${r.col}" stroke-width="2" ${r.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
    s += `<text x="${x(r.v)}" y="${T - 14 - k * 12}" text-anchor="middle" class="lbl" style="font-size:12px;fill:${r.col}">${esc(r.name)} ${fmtN(r.v)}</text>`;
  });
  rows.forEach((r, i) => {
    const cy = T + i * rowH + rowH / 2, op = r.used ? 1 : .35;
    const outside = false;
    s += `<text x="${L - 10}" y="${cy + 4}" text-anchor="end" style="font-size:11px;fill:#46605C;font-weight:${outside ? 700 : 500}">${esc(r.label.slice(0, 10))}${outside ? ' ⚑' : ''}</text>`;
    s += `<g opacity="${op}"><line x1="${x(r.ideal)}" x2="${x(r.max)}" y1="${cy}" y2="${cy}" stroke="#B9B3AA" stroke-width="2"/>`;
    const tip = `${r.label}\nideální ${fmtKc(r.ideal)} · maximální ${fmtKc(r.max)}`;
    s += `<circle cx="${x(r.ideal)}" cy="${cy}" r="6" fill="${C1}" stroke="#fff" stroke-width="2" data-tip="${esc(tip)}"/>`;
    s += `<circle cx="${x(r.max)}" cy="${cy}" r="6" fill="${C2}" stroke="#06403B" stroke-width="1.5" data-tip="${esc(tip)}"/></g>`;
  });
  return s + '</svg>';
}

// 4) Cenová mapa pro krok 5
function chartPriceMap(d) {
  const W = 600, L = 110, R = 22, T = 30, rowH = 54;
  const rowsDef = [];
  const costPts = [];
  if (d.v !== null) costPts.push({ v: d.v, name: 'Variabilní náklady', short: 'var.', col: CDARK, shape: 'sq' });
  if (d.m.unitCost !== null) costPts.push({ v: d.m.unitCost, name: 'Celkové náklady na jednotku', short: 'celk.', col: CDARK, shape: 'sq' });
  rowsDef.push(['Náklady', costPts]);
  const st = d.stats, cust = [];
  if (st.n) {
    cust.push({ v: st.idealMedian, name: 'Medián ideální ceny', short: 'ideál', col: C1, shape: 'c' });
    cust.push({ v: st.maxMedian, name: 'Medián maximální ceny', short: 'max.', col: C2, shape: 'c' });
  }
  rowsDef.push(['Zákazníci', cust, st.n ? [st.idealMedian, st.maxMedian] : null]);
  const comp = d.comps.filter(x => x.u.state === 'ok').map((x, i) => ({ v: x.u.value, name: x.c.name || 'Konkurent ' + (i + 1), short: 'K' + (i + 1), col: '#46605C', shape: 'd' }));
  rowsDef.push(['Konkurence', comp]);
  const all = rowsDef.flatMap(r => r[1].map(p => p.v)).concat(d.P !== null ? [d.P] : []);
  if (!all.length) return '<p class="hint">Mapa se zobrazí, jakmile budou k dispozici náklady, odpovědi zákazníků nebo ceny konkurence.</p>';
  const H = T + rowsDef.length * rowH + 34;
  const xt = ticks(0, Math.max(...all) * 1.08, 6), xmax = xt[xt.length - 1];
  const x = v => L + v / xmax * (W - L - R);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cenová mapa: náklady, zákaznická sonda a konkurence na jedné ose v Kč za jednotku">`;
  for (const t of xt) s += `<line x1="${x(t)}" x2="${x(t)}" y1="${T - 4}" y2="${H - 30}" stroke="${GRID}"/><text class="axt" x="${x(t)}" y="${H - 14}" text-anchor="middle">${fmtAxis(t)}</text>`;
  s += `<text class="axt" x="${W - R}" y="${H - 1}" text-anchor="end">Kč za ${esc(d.u.label)}</text>`;
  rowsDef.forEach(([name, pts, range], i) => {
    const cy = T + i * rowH + rowH / 2;
    s += `<text x="${L - 14}" y="${cy + 4}" text-anchor="end" style="font-size:12px;font-weight:700;fill:#06403B">${name}</text>`;
    if (!pts.length) { s += `<text x="${L + 4}" y="${cy + 4}" class="axt">zatím bez údajů</text>`; return; }
    if (range) s += `<rect x="${x(range[0])}" y="${cy - 5}" width="${Math.max(2, x(range[1]) - x(range[0]))}" height="10" rx="5" fill="#EFE0FE"/>`;
    const sorted = [...pts].sort((a, b) => a.v - b.v);
    let lastX = -99, flip = false;
    sorted.forEach(p => {
      const px = x(p.v);
      const tip = `${p.name}\n${fmtKc(p.v)}`;
      if (p.shape === 'sq') s += `<rect x="${px - 6}" y="${cy - 6}" width="12" height="12" rx="2" fill="${p.col}" data-tip="${esc(tip)}"/>`;
      else if (p.shape === 'd') s += `<path d="M${px},${cy - 8}L${px + 8},${cy}L${px},${cy + 8}L${px - 8},${cy}Z" fill="${p.col}" stroke="#fff" stroke-width="1.5" data-tip="${esc(tip)}"/>`;
      else s += `<circle cx="${px}" cy="${cy}" r="7" fill="${p.col}" stroke="${p.col === C2 ? '#06403B' : '#fff'}" stroke-width="${p.col === C2 ? 1.5 : 2}" data-tip="${esc(tip)}"/>`;
      flip = px - lastX < 46 ? !flip : false; lastX = px;
      s += `<text x="${px}" y="${flip ? cy + 22 : cy - 12}" text-anchor="middle" style="font-size:12px;fill:#46605C">${esc(p.short)}</text>`;
    });
  });
  if (d.P !== null) {
    s += `<line x1="${x(d.P)}" x2="${x(d.P)}" y1="${T - 8}" y2="${H - 30}" stroke="#06403B" stroke-width="2.5"/>`;
    s += `<rect x="${x(d.P) - 52}" y="${T - 28}" width="104" height="20" rx="10" fill="#EDD976"/><text x="${x(d.P)}" y="${T - 14}" text-anchor="middle" class="lbl" style="fill:#06403B">Naše cena ${fmtN(d.P)}</text>`;
  }
  return s + '</svg>';
}

// ===== Vykreslení kroků =====
const STEPS = ['Náš produkt', 'Naše náklady', 'Naši zákazníci', 'Naše konkurence', 'Naše cena', 'Ekonomické výsledky', 'Shrnutí'];

function listOf(p, list) { return list === 'xfixed' ? p.exp.fixed : list === 'xvariable' ? p.exp.variable : p[list]; }
function getPath(p, path) {
  if (path.includes(':')) { const [list, id, key] = path.split(':'); const it = listOf(p, list).find(r => r.id === id); return it ? it[key] : ''; }
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), p);
}
function setPath(p, path, val) {
  if (path.includes(':')) { const [list, id, key] = path.split(':'); const it = listOf(p, list).find(r => r.id === id); if (it) it[key] = val; return; }
  const ks = path.split('.'); let o = p; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val;
}
function numBad(val, opts = {}) {
  const r = parseNum(val);
  if (r.state === 'invalid') return 'Zadejte číslo (desetinná čárka je v pořádku).';
  if (r.state === 'ok' && r.value < 0 && !opts.neg) return 'Hodnota nemůže být záporná.';
  return '';
}
function inp(path, o = {}) {
  const p = P(), val = getPath(p, path) ?? '';
  const bad = o.num ? numBad(val, o) : '';
  const attrs = `data-bind="${path}" ${o.num ? `data-num="1" inputmode="decimal" ${o.neg ? 'data-neg="1"' : ''}` : ''} ${o.rerender ? 'data-rerender="1"' : ''} placeholder="${esc(o.ph || '')}" aria-label="${esc(o.aria || o.ph || '')}" ${o.id ? `id="${o.id}"` : ''}`;
  if (o.area) return `<textarea ${attrs} rows="${o.rows || 3}">${esc(val)}</textarea>`;
  return `<input type="${o.type || 'text'}" class="${o.num ? 'num' : ''} ${bad ? 'bad' : ''}" value="${esc(val)}" ${attrs} autocomplete="off">`;
}
function fld(label, path, o = {}) {
  const id = 'f_' + path.replace(/[^a-z0-9]/gi, '_');
  const control = o.suffix ? `<div class="withsuf">${inp(path, { ...o, id })}<span class="suf">${o.suffix}</span></div>` : inp(path, { ...o, id });
  return `<div class="f"><label for="${id}">${label}${o.optional ? ' <span class="opt">(volitelné)</span>' : ''}</label>${control}${o.num ? `<div class="errmsg" data-err="${path}"></div>` : ''}${o.hint ? `<div class="hint">${o.hint}</div>` : ''}</div>`;
}
function sel(path, options, o = {}) {
  const val = getPath(P(), path);
  return `<select data-bind="${path}" ${o.rerender ? 'data-rerender="1"' : ''} aria-label="${esc(o.aria || '')}" ${o.id ? `id="${o.id}"` : ''}>${options.map(([v, l]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
}
function head(i, lead) {
  return `<div class="stephead"><div class="kicker">Krok ${i} ze 7</div><h2>${STEPS[i - 1]}</h2>${lead ? `<p>${lead}</p>` : ''}</div>`;
}
function navRow(i) {
  return `<div class="navrow">${i > 1 ? `<button class="btn ghost" data-act="go" data-step="${i - 1}">← ${STEPS[i - 2]}</button>` : '<span></span>'}${i < 7 ? `<button class="btn" data-act="go" data-step="${i + 1}">Pokračovat: ${STEPS[i]} →</button>` : ''}</div>`;
}

// ---------- Krok 2 ----------

    </div>`).join('');
  const chips = (list, names) => {
    const used = new Set(p[list].map(r => (r.name || '').trim().toLowerCase()));
    return `<div class="lbl" style="margin-top:12px">Vyberte, co se vás týká:</div><div class="chips">${names.map(c => used.has(c.toLowerCase())

  return head(2, 'Rozdělte náklady podle toho, jak se chovají, když prodáte víc nebo míň.') + `

    <div class="card">
      <h3>Fixní náklady</h3>

function outPriceFb(d) {
  const { P: Pr, v } = d, uc = d.m.unitCost, st = d.stats;
  if (Pr === null) return d.pErr ? '' : '<p class="hint">Zadejte cenu a hned uvidíte, jak si stojí vůči nákladům, zákazníkům a konkurenci.</p>';

  if (v === null) out.push(['mid', 'ℹ︎', `Pro posouzení vůči nákladům: ${d.miss('v')[0]}`]);
  else if (Pr < v - 1e-9) out.push(['neg', '▼', `<b>Cena je pod variabilními náklady (${fmtKc(v)}).</b> Každá prodaná jednotka vám přidává ztrátu ${fmtKc(v - Pr)}. Větší prodej tohle bohužel nezachrání.`]);
  else if (Math.abs(Pr - v) <= 1e-9) out.push(['neg', '＝', `<b>Cena se rovná variabilním nákladům.</b> Každá jednotka se jen „zaplatí“, na fixní náklady nezbývá nic.`]);

  else if (Pr < uc - 1e-9) out.push(['mid', '◐', `<b>Cena je nad variabilními, ale pod celkovými náklady na jednotku (${fmtKc(uc)}).</b> Z každé jednotky zbývá ${fmtKc(Pr - v)} na fixní náklady, při plánovaném prodeji to ale nestačí. U penetrační strategie to může být záměr, pak to obhajte.`]);
  else out.push(['pos', '▲', `<b>Cena pokrývá celkové náklady při plánovaném prodeji (${fmtKc(uc)}).</b> Na každé jednotce zůstává ${fmtKc(Pr - uc)}.`]);
  if (st.n) {
    const accept = st.used.filter(u => u.max >= Pr).length;
    if (Pr > st.maxMedian) out.push(['mid', '?', `<b>Cena je nad mediánem maximálních cen respondentů (${fmtKc(st.maxMedian)}).</b> Nejde o zákaz, ale o podnět k obhajobě a ověření. Tuto cenu by ještě akceptovalo ${accept} z ${st.n} respondentů.`]);

  }
  const ok = d.comps.filter(x => x.u.state === 'ok').map(x => x.u.value);
  if (!P().noComp && ok.length) {
    const mn = Math.min(...ok), mx = Math.max(...ok);

    const pos = P().position;

// SVG → obrázek (html2canvas s inline SVG nepracuje spolehlivě)
async function svgToImg(svg) {
  const r = svg.getBoundingClientRect(); if (!r.width) return null;
  const c = svg.cloneNode(true);
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); c.setAttribute('width', r.width); c.setAttribute('height', r.height);
  c.querySelectorAll('.hit,.xh').forEach(n => n.remove());
  const ot = svg.querySelectorAll('text'), ct = c.querySelectorAll('text');
  ot.forEach((t, i) => { const cs = getComputedStyle(t); const n = ct[i]; if (!n) return; n.setAttribute('font-family', 'Plus Jakarta Sans, Arial, sans-serif'); n.setAttribute('font-size', cs.fontSize); n.setAttribute('font-weight', cs.fontWeight); n.setAttribute('fill', cs.fill); n.removeAttribute('class'); n.removeAttribute('style'); });
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  const cv = document.createElement('canvas'); cv.width = r.width * 2; cv.height = r.height * 2;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
  const out = document.createElement('img'); out.src = cv.toDataURL('image/png'); out.style.width = r.width + 'px'; out.style.height = r.height + 'px'; out.style.display = 'block';
  return out;
}
async function makePDF() {
  if (pdfBusy) return; pdfBusy = true;
  const p = P();
  const btn = document.querySelector('[data-act="pdf"]'); if (btn) { btn.disabled = true; btn.textContent = 'Připravuji PDF…'; }
  const filename = `za-kolik-${slug(p.meta.product)}.pdf`;
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:0;top:0;width:718px;z-index:-1;pointer-events:none;background:#fff';
  holder.innerHTML = `<div class="rep pdfsheet printing" style="max-width:none;width:718px;margin:0;padding:0;box-shadow:none">${finalBodyHTML()}</div>`;
  document.body.appendChild(holder);
  const sheet = holder.firstElementChild;

    if (typeof html2pdf !== 'function') throw new Error('nolib');
    for (const svg of [...sheet.querySelectorAll('svg')]) { try { const im = await svgToImg(svg); if (im) svg.replaceWith(im); } catch (e) { } }

      margin: [10, 10, 12, 10], filename,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'], avoid: ['tr', '.kpi', 'img', '.box', 'h2', '.keep', 'p'] },
    }).from(sheet).outputPdf('blob');
    window.scrollTo(0, y);
    if (DL) {
      try { await DL.save({ filename, data: blob }); toast('PDF je připravené ke stažení.'); }

    } else {

      if (k === 'v+15') e.variable.forEach(r => { const a = parseNum(r.amount); if (a.state === 'ok') r.amount = toInput(a.value * 1.15); });
      p.exp = e; p.expTried = true; scheduleSave(); keepY(); toast('Nová varianta: ' + b.textContent.trim() + ' oproti plánu.'); break;
    }
    case 'expreset': p.exp = expFromPlan(p); scheduleSave(); keepY(); break;
    case 'expadopt': {
      const x = expModel(p, unitInfo(p.meta).prec);
      if (x.errs.length) { toast('Nejdřív opravte hodnoty nové varianty.'); return; }
      const pl = p.plan, parts = [];
      if (Math.abs(x.P - pl.P) > 1e-9) parts.push(`cena ${fmtKc(pl.P)} → ${fmtKc(x.P)}`);
      if (Math.abs(x.Q - pl.Q) > 1e-9) parts.push(`plánovaný prodej ${fmtN(pl.Q)} → ${fmtN(x.Q)}`);
      if (Math.abs(x.F - pl.F) > 1e-9) parts.push(`fixní náklady ${fmtKc(pl.F)} → ${fmtKc(x.F)}`);
      if (Math.abs(x.v - pl.v) > 1e-9) parts.push(`variabilní náklady ${fmtKc(pl.v)} → ${fmtKc(x.v)} na jednotku`);
      const sameItems = JSON.stringify(pl.fixed.map(r => [r.name, r.amount, r.period])) === JSON.stringify(p.exp.fixed.map(r => [r.name, r.amount, r.period])) && JSON.stringify(pl.variable.map(r => [r.name, r.amount])) === JSON.stringify(p.exp.variable.map(r => [r.name, r.amount]));
      if (!parts.length && sameItems) { toast('Nová varianta se od plánu neliší.'); return; }
      if (!parts.length) parts.push('upravené názvy nebo rozložení nákladových položek');
      confirmBox('Přijmout variantu jako náš plán?', 'Změní se vstupy v krocích 1–5: ' + parts.join('; ') + '.', 'Přijmout jako náš plán', () => {
        p.pricing.price = toInput(x.P); p.meta.qty = toInput(x.Q);
        if (x.mode === 'markup') p.pricing.markup = toInput(x.markup);
        p.fixed = cloneItems(p.exp.fixed.filter(r => filled(r.name) || filled(r.amount)), true);
        p.variable = cloneItems(p.exp.variable.filter(r => filled(r.name) || filled(r.amount)), false);
        const d = derive(p); p.plan = planSnapshot(p, d); p.exp = expFromPlan(p);
        scheduleSave(); keepY(); toast('Nová varianta je teď vaším plánem.');
      });
      break;
    }
    case 'export': doExport(); break;
    case 'import': importBox(); break;
    case 'report': reportBox(); break;
    case 'pdf': makePDF(); break;
    case 'printhtml': offerFile(`za-kolik-shrnuti-${slug(p.meta.product)}.html`, reportHTML(), 'Verze pro tisk'); break;
  }
});

const tip = document.createElement('div'); tip.id = 'tip'; document.body.appendChild(tip);
document.addEventListener('pointermove', ev => {
  const t = ev.target;
  const svg = t.closest && t.closest('svg[data-cvp]');
  document.querySelectorAll('svg[data-cvp] .xh').forEach(l => { if (!svg || l.ownerSVGElement !== svg) l.setAttribute('visibility', 'hidden'); });
  if (t.dataset && t.dataset.tip) { showTip(t.dataset.tip, ev); return; }
  if (svg && t.classList.contains('hit')) {
    const c = JSON.parse(svg.dataset.cvp), r = svg.getBoundingClientRect(), sx = c.W / r.width;
    const px = (ev.clientX - r.left) * sx, q = Math.max(0, (px - c.L) / (c.W - c.L - c.R) * c.qmax);
    const line = svg.querySelector('.xh'); line.setAttribute('x1', px); line.setAttribute('x2', px); line.setAttribute('visibility', 'visible');
    const rev = c.P * q, cost = c.F + c.v * q, pr = rev - cost;
    showTip(`Množství: ${fmtN(q, nf0)} ${c.u}\nTržby: ${fmtKc(rev)}\nFixní náklady: ${fmtKc(c.F)}\nVariabilní náklady: ${fmtKc(c.v * q)}\nCelkové náklady: ${fmtKc(cost)}\n${pr >= 0 ? 'Zisk' : 'Ztráta'}: ${fmtKc(pr)}`, ev); return;
  }
  tip.classList.remove('on');
});
function showTip(text, ev) {
  tip.textContent = text; tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY - h - 10;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('pointerleave', () => tip.classList.remove('on'));

// ---------- modaly ----------
function modal(html, wide) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) close(); });
  setTimeout(() => { const f = m.querySelector('[data-ok],button,textarea'); if (f) f.focus(); }, 30);
  return { el: m, close };
}
function confirmBox(title, text, okLabel, onOk, danger) {
  const md = modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn ghost" data-close>Zrušit</button><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(okLabel)}</button></div>`);
  md.el.querySelector('[data-ok]').onclick = () => { md.close(); onOk(); };
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function slug(s) { return (s || 'projekt').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'projekt'; }
async function offerFile(filename, data, label) {
  if (DL) {
    try { await DL.save({ filename, data }); toast(label + ' je připravený ke stažení.'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  // běžný web (GitHub Pages): přímé stažení
  if (!window.claude) {
    try { const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast(label + ' se stahuje.'); return; } catch (e) { }
  }
  // záloha: zobrazit obsah ke zkopírování
  const md = modal(`<h3>${esc(label)}</h3><p class="hint">Stažení tady není k dispozici. Obsah zkopírujte a uložte do souboru <b>${esc(filename)}</b>.</p><textarea style="min-height:240px;font-family:ui-monospace,monospace;font-size:.78rem" readonly>${esc(data)}</textarea><div class="acts"><button class="btn ghost" data-close>Zavřít</button><button class="btn" data-ok>Kopírovat</button></div>`, true);
  md.el.querySelector('[data-ok]').onclick = async () => { try { await navigator.clipboard.writeText(data); toast('Zkopírováno.'); } catch (e) { md.el.querySelector('textarea').select(); toast('Označeno, zkopírujte pomocí Ctrl+C.'); } };
}
function doExport() {
  const p = P();
  const data = JSON.stringify({ app: 'za-kolik', version: 1, exportedAt: new Date().toISOString(), project: p }, null, 2);
  const date = new Date().toISOString().slice(0, 10);
  offerFile(`za-kolik-${slug(p.meta.product)}-${date}.json`, data, 'Export projektu');
}
function importBox() {
  const md = modal(`<h3>Importovat projekt</h3>
    <p class="hint">Vyberte soubor .json exportovaný z aplikace Za kolik?, nebo jeho obsah vložte níže. Import se načte do vašeho vlastního projektu.</p>
    <input type="file" accept=".json,application/json" id="impfile" style="margin:10px 0">
    <textarea id="imptext" placeholder="…nebo sem vložte obsah souboru" style="min-height:120px;font-family:ui-monospace,monospace;font-size:.78rem"></textarea>
    <div id="impmsg" style="margin-top:10px"></div>
    <div class="acts"><button class="btn ghost" data-close>Zrušit</button><button class="btn" data-ok>Zkontrolovat a načíst</button></div>`);
  const fileEl = md.el.querySelector('#impfile'), txt = md.el.querySelector('#imptext'), msg = md.el.querySelector('#impmsg');
  fileEl.onchange = () => { const f = fileEl.files[0]; if (!f) return; if (f.size > 5e6) { msg.innerHTML = '<div class="info bad">Soubor je příliš velký.</div>'; return; } const r = new FileReader(); r.onload = () => { txt.value = r.result; }; r.readAsText(f); };
  md.el.querySelector('[data-ok]').onclick = () => {
    let res;
    try {
      let o; try { o = JSON.parse(txt.value); } catch (e) { throw new Error('Obsah není platný JSON. Zkontrolujte, že jste vložili celý soubor.'); }
      if (o && o.app && o.app !== 'za-kolik') throw new Error('Soubor pochází z jiné aplikace.');
      res = sanitizeProject(o && o.project ? o.project : o);
    } catch (e) { msg.innerHTML = `<div class="info bad"><b>Import se nepodařil.</b> ${esc(e.message)}</div>`; return; }
    const pr = res.project; pr.isDemo = false;
    const summary = `Produkt: <b>${esc(pr.meta.product || 'bez názvu')}</b> · fixních položek ${pr.fixed.length} · variabilních ${pr.variable.length} · respondentů ${pr.resp.length} · konkurentů ${pr.comps.length}`;
    const apply = () => { S.store.own = pr; S.store.active = 'own'; saveNow(); md.close(); S.view = 'step'; renderAll(); setStep(1); toast('Projekt byl načten.'); };
    msg.innerHTML = `<div class="info">${summary}</div>${res.warn.map(w => `<div class="info warn">${esc(w)}</div>`).join('')}`;
    const okBtn = md.el.querySelector('[data-ok]');
    if (projectHasData(S.store.own)) {
      msg.innerHTML += `<div class="info bad"><b>Pozor:</b> import přepíše váš rozpracovaný projekt v tomto prohlížeči. Pokud si ho chcete ponechat, nejdřív ho exportujte.</div>`;
      okBtn.textContent = 'Přepsat a načíst'; okBtn.classList.add('danger');
    } else okBtn.textContent = 'Načíst projekt';
    okBtn.onclick = apply;
  };
}

}
